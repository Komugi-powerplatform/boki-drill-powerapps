App:
  Properties:
    Formulas: |-
      =nfQuestions = Table(
        {Id:"C01", Category:"現金預金", Method:"", Text:"現金の実際有高が帳簿残高より3,000円多いことが判明した。原因は不明である。", Explain:"実際に合わせて現金を増やす（借方）。相手は原因がわかるまでの仮の科目「現金過不足」。", Traps:""},
        {Id:"C02", Category:"現金預金", Method:"", Text:"現金の実際有高が帳簿残高より5,000円少ないことが判明した。原因は不明である。", Explain:"実際に合わせて現金を減らす（貸方）。現金の向きを先に決めると逆転しない。", Traps:""},
        {Id:"C03", Category:"現金預金", Method:"", Text:"決算にあたり、現金過不足勘定の借方残高4,000円のうち3,000円は交通費の記入漏れと判明した。残額は原因不明のため適切な科目に振り替える。", Explain:"借方残高の現金過不足を貸方で消す。判明分は交通費、不明分は損なので雑損。", Traps:"旅費交通費、雑損失"},
        {Id:"C04", Category:"現金預金", Method:"", Text:"小口現金係から、通信費2,000円・交通費3,000円の支払報告を受け、ただちに同額を普通預金から小口現金に補給した。", Explain:"報告と補給が同時なら小口現金は増減なしで相殺され、費用と普通預金だけが残る。", Traps:""},
        {Id:"C05", Category:"現金預金", Method:"", Text:"普通預金口座から500,000円を引き出し、定期預金（1年満期）に預け入れた。", Explain:"預金どうしの移し替え。増えた定期預金が借方。", Traps:""},
        {Id:"C06", Category:"現金預金", Method:"", Text:"現金200,000円を当座預金口座に預け入れた。", Explain:"当座預金が増えて現金が減る。", Traps:""},
        {Id:"C07", Category:"現金預金", Method:"", Text:"普通預金口座に80,000円の入金があったが、その内容は不明である。", Explain:"入金理由がわかるまでは負債の「仮受金」で受けておく。", Traps:""},
        {Id:"C08", Category:"現金預金", Method:"", Text:"先日内容不明で処理していた入金80,000円は、得意先からの売掛金の回収であると判明した。", Explain:"仮受金を消して（借方）、本来の売掛金の減少（貸方）に振り替える。", Traps:""},
        {Id:"C09", Category:"現金預金", Method:"", Text:"従業員の出張にあたり、旅費の概算額50,000円を現金で渡した。", Explain:"金額が確定するまでは資産の「仮払金」。", Traps:""},
        {Id:"C10", Category:"現金預金", Method:"", Text:"出張から戻った従業員から旅費46,000円の報告を受け、残金4,000円を現金で受け取った（概算額50,000円は仮払金で処理済み）。", Explain:"全経では「旅費」と「交通費」は別の科目。出張は旅費。", Traps:"旅費交通費"},
        {Id:"D01", Category:"債権債務", Method:"", Text:"取引先に現金300,000円を貸し付けた。", Explain:"お金を返してもらう権利＝資産の貸付金。", Traps:""},
        {Id:"D02", Category:"債権債務", Method:"", Text:"取引先に貸し付けていた300,000円を、利息6,000円とともに普通預金口座への振込みで回収した。", Explain:"元本は貸付金の減少、利息は収益の受取利息。", Traps:""},
        {Id:"D03", Category:"債権債務", Method:"", Text:"銀行から1,000,000円を借り入れ、普通預金口座に入金された。", Explain:"返す義務＝負債の借入金。", Traps:""},
        {Id:"D04", Category:"債権債務", Method:"", Text:"借入金1,000,000円を利息15,000円とともに普通預金口座から返済した。", Explain:"元本は借入金の減少、利息は費用の支払利息。", Traps:""},
        {Id:"D05", Category:"債権債務", Method:"", Text:"従業員が個人で負担すべき物品代10,000円を、会社が現金で立て替えた（従業員に関する勘定を用いる）。", Explain:"従業員分は「従業員立替金」。「立替え金」「立替金」と書かない。", Traps:"立替え金、従業員立替え金"},
        {Id:"D06", Category:"債権債務", Method:"", Text:"事務用のパソコン200,000円を購入し、代金は月末に支払うことにした。", Explain:"商品以外の後払いは買掛金でなく未払金。", Traps:""},
        {Id:"D07", Category:"債権債務", Method:"", Text:"商品500,000円を注文し、内金として100,000円を普通預金口座から支払った。", Explain:"商品を受け取る前に払ったお金は資産の前払金（支払手付金も可）。", Traps:""},
        {Id:"D08", Category:"債権債務", Method:"三分法", Text:"注文していた商品500,000円を受け取り、内金100,000円を差し引いた残額は掛けとした（三分法）。", Explain:"内金の前払金を取り崩し、残りが買掛金。「仕入れ」と送りがなを付けない。", Traps:"仕入れ"},
        {Id:"D09", Category:"債権債務", Method:"", Text:"得意先から商品の注文を受け、内金50,000円を現金で受け取った。", Explain:"商品を渡す義務＝負債の前受金（受取手付金も可）。", Traps:""},
        {Id:"D10", Category:"債権債務", Method:"", Text:"得意先から売掛金250,000円が普通預金口座に振り込まれた。", Explain:"売掛金（資産）の減少は貸方。", Traps:""},
        {Id:"D11", Category:"債権債務", Method:"", Text:"仕入先への買掛金180,000円を、インターネット・バンキングで当座預金口座から支払った。", Explain:"令和9年度から小切手は出題外。当座預金は振込み決済で出る。", Traps:""},
        {Id:"D12", Category:"債権債務", Method:"", Text:"仕入先への買掛金100,000円を普通預金口座から振り込み、振込手数料440円も同口座から支払った。", Explain:"振込手数料は支払手数料。", Traps:""},
        {Id:"D13", Category:"債権債務", Method:"", Text:"不用になった段ボールを3,000円で売却し、代金は後日受け取ることにした。", Explain:"商品以外の代金の後受けは「未収金」。全経の表記は未収金（未収入金ではない）。", Traps:"未収入金"},
        {Id:"M01", Category:"商品売買", Method:"三分法", Text:"商品300,000円を掛けで仕入れ、引取運賃5,000円は現金で支払った（三分法）。", Explain:"仕入れ側の付随費用は仕入原価に含める。", Traps:"仕入れ"},
        {Id:"M02", Category:"商品売買", Method:"三分法", Text:"商品400,000円を掛けで販売し、当社負担の発送費6,000円を現金で支払った（三分法）。", Explain:"売り手側負担の発送費は費用の発送費。", Traps:""},
        {Id:"M03", Category:"商品売買", Method:"三分法", Text:"掛けで仕入れた商品のうち20,000円分を、品違いのため返品した（三分法）。", Explain:"仕入の取消しなので仕入を貸方に。", Traps:"仕入れ"},
        {Id:"M04", Category:"商品売買", Method:"三分法", Text:"掛けで販売した商品のうち15,000円分が返品された（三分法）。", Explain:"売上の取消しなので売上を借方に。", Traps:""},
        {Id:"M05", Category:"商品売買", Method:"三分法", Text:"決算にあたり、期首商品棚卸高80,000円を仕入勘定に振り替えた（三分法・売上原価は仕入勘定で計算）。", Explain:"「しーくり」の前半。繰越商品は送りがななし。", Traps:"繰り越し商品、繰越し商品"},
        {Id:"M06", Category:"商品売買", Method:"三分法", Text:"決算にあたり、期末商品棚卸高95,000円を仕入勘定から繰越商品勘定に振り替えた（三分法）。", Explain:"「くりしー」。売れ残りを資産に戻す。", Traps:"繰り越し商品、繰越し商品"},
        {Id:"M07", Category:"商品売買", Method:"分記法", Text:"商品200,000円を掛けで仕入れた（分記法）。", Explain:"分記法では仕入れた商品は資産の「商品」。仕入勘定は使わない。", Traps:""},
        {Id:"M08", Category:"商品売買", Method:"分記法", Text:"原価150,000円の商品を200,000円で販売し、代金は掛けとした（分記法）。", Explain:"分記法は売るたびに儲けを出す。全経の表記は「商品販売益」。", Traps:"商品売買益"},
        {Id:"M09", Category:"商品売買", Method:"分記法", Text:"原価60,000円の商品を90,000円で販売し、代金は現金で受け取った（分記法）。", Explain:"貸方は原価分の商品と、差額の商品販売益に分ける。", Traps:"商品売買益"},
        {Id:"M10", Category:"商品売買", Method:"売上原価対立法", Text:"商品250,000円を掛けで仕入れた（売上原価対立法）。", Explain:"対立法も仕入時は資産の商品。", Traps:""},
        {Id:"M11", Category:"商品売買", Method:"売上原価対立法", Text:"原価180,000円の商品を240,000円で販売し、代金は掛けとした（売上原価対立法）。", Explain:"売価で売上、同時に原価で商品→売上原価へ振り替える。", Traps:""},
        {Id:"M12", Category:"商品売買", Method:"売上原価対立法", Text:"掛けで販売した商品（売価30,000円、原価20,000円）が返品された（売上原価対立法）。", Explain:"販売時の仕訳の逆。第223回 第1問7で出題。", Traps:""},
        {Id:"M13", Category:"商品売買", Method:"売上原価対立法", Text:"原価70,000円の商品を100,000円で販売し、代金は現金で受け取った（売上原価対立法）。", Explain:"2行ずつの形を体で覚える。", Traps:""},
        {Id:"M14", Category:"商品売買", Method:"三分法", Text:"商品100,000円（税抜）を仕入れ、消費税10,000円とともに代金は掛けとした（三分法・税抜方式）。", Explain:"払った消費税は資産の仮払消費税。", Traps:""},
        {Id:"M15", Category:"商品売買", Method:"三分法", Text:"商品300,000円（税抜）を販売し、消費税30,000円とともに代金は掛けとした（三分法・税抜方式）。", Explain:"預かった消費税は負債の仮受消費税。", Traps:""},
        {Id:"F01", Category:"固定資産", Method:"", Text:"備品400,000円を購入し、据付費10,000円とともに普通預金口座から支払った。", Explain:"付随費用は取得原価に含める。", Traps:""},
        {Id:"F02", Category:"固定資産", Method:"", Text:"建物5,000,000円を購入し、仲介手数料150,000円とともに普通預金口座から支払った。", Explain:"仲介手数料も建物の取得原価。支払手数料にしない。", Traps:""},
        {Id:"F03", Category:"固定資産", Method:"", Text:"土地3,000,000円を購入し、代金は月末に支払うことにした。なお、登記料50,000円は現金で支払った。", Explain:"土地は商品ではないので後払いは未払金。", Traps:""},
        {Id:"F04", Category:"固定資産", Method:"", Text:"決算にあたり、備品（取得原価500,000円、残存価額0円、耐用年数5年）の減価償却を定額法・直接法で行った。", Explain:"3級は直接法のみ（間接法は2級）。備品を直接減らす。", Traps:"減価償却累計額、備品減価償却累計額"},
        {Id:"F05", Category:"固定資産", Method:"", Text:"建物の修繕を行い、修繕代80,000円を現金で支払った。", Explain:"修繕は費用の修繕費。", Traps:""},
        {Id:"T01", Category:"給料・税金", Method:"", Text:"従業員の給料300,000円の支払いにあたり、所得税20,000円と社会保険料15,000円を差し引き、残額を普通預金口座から支払った（預り金は内容別の勘定を用いる）。", Explain:"天引き分は会社が預かっている負債。", Traps:"給与、預かり金"},
        {Id:"T02", Category:"給料・税金", Method:"", Text:"従業員の給料から差し引いていた所得税20,000円を現金で納付した。", Explain:"預かっていた負債を払って消す。", Traps:"所得税預かり金"},
        {Id:"T03", Category:"給料・税金", Method:"", Text:"従業員から預かっていた社会保険料15,000円を普通預金口座から納付した。", Explain:"第223回 第1問3で出題。", Traps:"社会保険料預かり金"},
        {Id:"T04", Category:"給料・税金", Method:"", Text:"固定資産税40,000円を現金で納付した。", Explain:"費用になる税金は租税公課。", Traps:""},
        {Id:"T05", Category:"給料・税金", Method:"", Text:"収入印紙2,000円を現金で購入した。", Explain:"印紙代も租税公課。", Traps:"印紙税"},
        {Id:"T06", Category:"給料・税金", Method:"", Text:"決算にあたり、仮受消費税30,000円と仮払消費税10,000円を相殺し、差額を納付額として計上した。", Explain:"全経3級の標準科目は「未払税金」。", Traps:"未払消費税"},
        {Id:"T07", Category:"給料・税金", Method:"", Text:"得意先を接待し、飲食代30,000円を現金で支払った。", Explain:"第223回 第1問4で出題。", Traps:"接待交際費"},
        {Id:"T08", Category:"給料・税金", Method:"", Text:"広告用チラシの印刷代50,000円を現金で支払った。", Explain:"全経の表記は「広告費」。", Traps:"広告宣伝費"},
        {Id:"T09", Category:"給料・税金", Method:"", Text:"営業のための電車代1,200円を現金で支払った。", Explain:"近距離の移動は交通費、出張は旅費。", Traps:"旅費交通費"},
        {Id:"T10", Category:"給料・税金", Method:"", Text:"今月分の電気代・水道代18,000円が普通預金口座から引き落とされた。", Explain:"電気・水道・ガスはまとめて水道光熱費。", Traps:"水道高熱費"},
        {Id:"K01", Category:"決算", Method:"", Text:"決算にあたり、売掛金残高500,000円に対して3％の貸倒れを見積もる。貸倒引当金の残高は6,000円である（差額補充法）。", Explain:"設定額15,000円−残高6,000円＝差額9,000円だけ繰り入れる。", Traps:"貸し倒れ引当金繰入、貸倒引当金繰入れ"},
        {Id:"K02", Category:"決算", Method:"", Text:"前期に発生した売掛金20,000円が貸し倒れた。貸倒引当金の残高は30,000円である。", Explain:"前期分は引当金を取り崩す。", Traps:"貸し倒れ引当金"},
        {Id:"K03", Category:"決算", Method:"", Text:"当期に発生した売掛金12,000円が貸し倒れた。", Explain:"当期分は引当金を使わず貸倒損失。", Traps:"貸し倒れ損失"},
        {Id:"K04", Category:"決算", Method:"", Text:"決算にあたり、支払家賃のうち60,000円は次期分であることが判明した。", Explain:"次期分を費用から抜いて資産へ。", Traps:""},
        {Id:"K05", Category:"決算", Method:"", Text:"決算にあたり、当期分の給料25,000円が未払いである。", Explain:"当期分の費用を足し、払う義務を負債に。", Traps:""},
        {Id:"K06", Category:"決算", Method:"", Text:"購入時に消耗品費で処理していた事務用品のうち、8,000円分が期末に未使用で残っている。", Explain:"未使用分は資産の消耗品に振り替える。", Traps:""},
        {Id:"K07", Category:"決算", Method:"", Text:"決算にあたり、支払った保険料のうち12,000円は次期分である。", Explain:"費用の保険料を減らして資産の前払保険料へ。", Traps:""},
        {Id:"K08", Category:"決算", Method:"", Text:"決算にあたり、売上勘定の残高1,200,000円を損益勘定に振り替えた。", Explain:"収益は貸方残高なので借方で消して損益の貸方へ。", Traps:""},
        {Id:"K09", Category:"決算", Method:"", Text:"決算にあたり、仕入勘定の残高800,000円を損益勘定に振り替えた。", Explain:"費用は借方残高なので貸方で消して損益の借方へ。", Traps:"仕入れ"},
        {Id:"K10", Category:"決算", Method:"", Text:"損益勘定で当期純利益150,000円が計算されたので、繰越利益剰余金勘定に振り替えた。", Explain:"第223回 第1問2で出題。利益は純資産を増やす（貸方）。", Traps:"繰越利益余剰金、繰り越し利益剰余金"},
        {Id:"K11", Category:"決算", Method:"", Text:"損益勘定で当期純損失40,000円が計算されたので、繰越利益剰余金勘定に振り替えた。", Explain:"損失は純資産を減らす（借方）。", Traps:"繰越利益余剰金"},
