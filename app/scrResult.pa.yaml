Screens:
  scrResult:
    Properties:
      Fill: =RGBA(247, 246, 242, 1)
      OnVisible: =IfError(ClearCollect(colWeak, BokiWeakList), Set(varWeakLoad, "error"), Set(varWeakLoad, "ok"))
    Children:
      - conscrResultRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =0
            PaddingTop: =0
            PaddingRight: =0
            PaddingBottom: =0
            PaddingLeft: =0
            Fill: =RGBA(247, 246, 242, 1)
            DropShadow: =DropShadow.None
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            Width: =Parent.Width
            Height: =Parent.Height
            X: =0
            Y: =0
          Children:
            - conResTop:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =8
                  PaddingTop: =10
                  PaddingRight: =16
                  PaddingBottom: =10
                  PaddingLeft: =16
                  Fill: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Center
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  Height: =64
                  Width: =Min(560, Parent.Width)
                Children:
                  - btnResBack:
                      Control: ModernButton
                      Properties:
                        Text: ="‹ 戻る"
                        OnSelect: =Navigate(If(varOrigin = "scrWeak", scrWeak, Screen1))
                        Height: =44
                        LayoutMinHeight: =44
                        LayoutMinWidth: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Size: =15
                        Layout: =ButtonLayout.TextOnly
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =RGBA(46, 94, 110, 1)
                        AccessibleLabel: ="戻る"
                        Width: =88
                  - lblResTitle:
                      Control: ModernText
                      Properties:
                        Text: ="結果"
                        Size: =20
                        FontWeight: =FontWeight.Bold
                        Color: =RGBA(31, 35, 40, 1)
                        Wrap: =true
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        Align: =Align.Center
                        LayoutMinWidth: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =44
                        LayoutMinHeight: =44
                        VerticalAlign: =VerticalAlign.Middle
                  - lblResTopPad:
                      Control: ModernText
                      Properties:
                        Text: =""
                        Size: =13
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(31, 35, 40, 1)
                        Wrap: =true
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        Align: =Align.Left
                        LayoutMinWidth: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        Height: =44
                        LayoutMinHeight: =44
                        Width: =88
            - conResBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =16
                  PaddingTop: =8
                  PaddingRight: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  Fill: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Center
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  Width: =Min(560, Parent.Width)
                  LayoutOverflowY: =LayoutOverflow.Scroll
                Children:
                  - conResScore:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =4
                        PaddingTop: =16
                        PaddingRight: =16
                        PaddingBottom: =16
                        PaddingLeft: =16
                        Fill: =RGBA(255, 255, 255, 1)
                        DropShadow: =DropShadow.None
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        Height: =If(varBestSaveFailed, 200, 148)
                        BorderColor: =RGBA(217, 214, 207, 1)
                        BorderThickness: =1
                        BorderStyle: =BorderStyle.Solid
                      Children:
                        - lblResReason:
                            Control: ModernText
                            Properties:
                              Text: =varEndReason
                              Size: =13
                              FontWeight: =FontWeight.Normal
                              Color: =RGBA(90, 95, 102, 1)
                              Wrap: =true
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              Align: =Align.Left
                              LayoutMinWidth: =0
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =20
                              LayoutMinHeight: =20
                        - lblResScore:
                            Control: ModernText
                            Properties:
                              Text: =varScore & " 点"
                              Size: =32
                              FontWeight: =FontWeight.Bold
                              Color: =RGBA(31, 35, 40, 1)
                              Wrap: =true
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              Align: =Align.Left
                              LayoutMinWidth: =0
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =50
                              LayoutMinHeight: =50
                              AccessibleLabel: =varEndReason & "。得点 " & varScore & "点"
                        - lblResBest:
                            Control: ModernText
                            Properties:
                              Text: =If(varIsNewBest, "○ 自己ベスト更新！ " & If(varHadBest, "これまで " & varPrevBest & "点", "初めての記録です"), If(varBestSaveFailed, "", "自己ベスト " & varPrevBest & "点（あと " & (varPrevBest - varScore) & "点）"))
                              Size: =16
                              FontWeight: =FontWeight.Semibold
                              Color: =If(varIsNewBest, RGBA(30, 107, 58, 1), RGBA(31, 35, 40, 1))
                              Wrap: =true
                              PaddingTop: =6
                              PaddingBottom: =6
                              PaddingLeft: =6
                              PaddingRight: =6
                              Align: =Align.Left
                              LayoutMinWidth: =0
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =36
                              LayoutMinHeight: =36
                              Fill: =If(varIsNewBest, RGBA(230, 242, 234, 1), RGBA(0, 0, 0, 0))
                        - lblResBestErr:
                            Control: ModernText
                            Properties:
                              Text: ="! 自己ベストを保存できませんでした。次回起動時には反映されません"
                              Size: =14
                              FontWeight: =FontWeight.Normal
                              Color: =RGBA(122, 83, 0, 1)
                              Wrap: =true
                              PaddingTop: =4
                              PaddingBottom: =4
                              PaddingLeft: =4
                              PaddingRight: =4
                              Align: =Align.Left
                              LayoutMinWidth: =0
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =48
                              LayoutMinHeight: =48
                              Fill: =RGBA(255, 244, 214, 1)
                              Visible: =varBestSaveFailed
                  - conResStats:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        PaddingTop: =0
                        PaddingRight: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        Height: =30
                      Children:
                        - lblResCorrect:
                            Control: ModernText
                            Properties:
                              Text: ="正解 " & varCorrect & " ／ " & varAnswered & "問"
                              Size: =18
                              FontWeight: =FontWeight.Semibold
                              Color: =RGBA(31, 35, 40, 1)
                              Wrap: =true
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              Align: =Align.Left
                              LayoutMinWidth: =0
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =30
                              LayoutMinHeight: =30
                        - lblResCombo:
                            Control: ModernText
                            Properties:
                              Text: ="最大コンボ " & varMaxCombo
                              Size: =18
                              FontWeight: =FontWeight.Semibold
                              Color: =RGBA(31, 35, 40, 1)
                              Wrap: =true
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              Align: =Align.Left
                              LayoutMinWidth: =0
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =30
                              LayoutMinHeight: =30
                  - lblResWeak:
                      Control: ModernText
                      Properties:
                        Text: =If(varIsWeakDrill, "苦手リストから外れた " & varWeakRemoved & "問・追加 " & varWeakAdded & "問", "苦手リストに追加 " & varWeakAdded & "問")
                        Size: =16
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(31, 35, 40, 1)
                        Wrap: =true
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        Align: =Align.Left
                        LayoutMinWidth: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =26
                        LayoutMinHeight: =26
                  - btnResWeak:
                      Control: ModernButton
                      Properties:
                        Text: ="苦手リストへ"
                        OnSelect: =Navigate(scrWeak)
                        Height: =48
                        LayoutMinHeight: =48
                        LayoutMinWidth: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Size: =16
                        Layout: =ButtonLayout.TextOnly
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =RGBA(46, 94, 110, 1)
                        AccessibleLabel: ="苦手リストへ"
                  - btnResHome:
                      Control: ModernButton
                      Properties:
                        Text: ="ホームへ"
                        OnSelect: =Navigate(Screen1)
                        Height: =48
                        LayoutMinHeight: =48
                        LayoutMinWidth: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Size: =16
                        Layout: =ButtonLayout.TextOnly
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =RGBA(46, 94, 110, 1)
                        AccessibleLabel: ="ホームへ"
            - conResBottom:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =4
                  PaddingTop: =8
                  PaddingRight: =16
                  PaddingBottom: =12
                  PaddingLeft: =16
                  Fill: =RGBA(247, 246, 242, 1)
                  DropShadow: =DropShadow.None
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Center
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  Height: =96
                  Width: =Min(560, Parent.Width)
                Children:
                  - lblResScopeInfo:
                      Control: ModernText
                      Properties:
                        Text: =If(CountRows(If(varIsWeakDrill, Filter(nfQuestions, Id in colWeak.Title), If(varScope = "全問", nfQuestions, Filter(nfQuestions, Method = varScope)))) = 0, "この範囲には問題がありません", If(varIsWeakDrill, "苦手のみ", varScope) & "・" & CountRows(If(varIsWeakDrill, Filter(nfQuestions, Id in colWeak.Title), If(varScope = "全問", nfQuestions, Filter(nfQuestions, Method = varScope)))) & "問")
                        Size: =13
                        FontWeight: =FontWeight.Normal
                        Color: =RGBA(90, 95, 102, 1)
                        Wrap: =true
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        Align: =Align.Left
                        LayoutMinWidth: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =20
                        LayoutMinHeight: =20
                  - btnResAgain:
                      Control: ModernButton
                      Properties:
                        Text: ="同じ範囲でもう一度"
                        OnSelect: |-
                          =Set(varScope, varScope);
                          Set(varIsWeakDrill, varIsWeakDrill);
                          Set(varOrigin, varOrigin);
                          If(varIsWeakDrill, IfError(ClearCollect(colWeak, BokiWeakList), Set(varWeakLoad, "error"), Set(varWeakLoad, "ok")));
                          ClearCollect(colDrill, ForAll(Shuffle(If(varIsWeakDrill, Filter(nfQuestions, Id in colWeak.Title), If(varScope = "全問", nfQuestions, Filter(nfQuestions, Method = varScope)))) As p, {Id: p.Id, Seq: 0}));
                          Set(varTotal, CountRows(colDrill));
                          Set(varIdx, 1);
                          Set(varQ, LookUp(nfQuestions, Id = First(colDrill).Id));
                          Set(varScore, 0); Set(varCombo, 0); Set(varMaxCombo, 0); Set(varCorrect, 0); Set(varAnswered, 0);
                          Set(varWeakAdded, 0); Set(varWeakRemoved, 0);
                          Set(varGraded, false); Set(varQuitConfirm, false); Set(varEmptyError, false);
                          Set(varWeakMsg, ""); Set(varWeakSaveFailed, false);
                          Set(varDebRows, 1); Set(varCreRows, 1);
                          Set(varEndReason, ""); Set(varIsNewBest, false); Set(varBestSaveFailed, false);
                          Set(varDrillStart, Now()); Set(varNow, Now());
                          Set(varDrillRunning, varTotal > 0);
                          If(varTotal > 0, Navigate(scrDrill))
                        Height: =52
                        LayoutMinHeight: =52
                        LayoutMinWidth: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Size: =17
                        Layout: =ButtonLayout.TextOnly
                        Appearance: =ButtonAppearance.Primary
                        BasePaletteColor: =RGBA(46, 94, 110, 1)
                        AccessibleLabel: ="同じ範囲でもう一度"
                        DisplayMode: =If(CountRows(If(varIsWeakDrill, Filter(nfQuestions, Id in colWeak.Title), If(varScope = "全問", nfQuestions, Filter(nfQuestions, Method = varScope)))) = 0, DisplayMode.Disabled, DisplayMode.Edit)
